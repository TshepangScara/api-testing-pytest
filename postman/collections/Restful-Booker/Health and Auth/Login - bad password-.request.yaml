$kind: http-request
name: Login - bad password.
url: "{{base_url}}/auth"
method: POST
headers:
  Accept: " application/json"
body:
  type: json
  content: "{\r

    \    \"username\": \"{{username}}\",\r

    \    \"password\": \"wrong\"\r

    }\r\n"
settings:
  disabledSystemHeaders:
    - accept
order: 3000
