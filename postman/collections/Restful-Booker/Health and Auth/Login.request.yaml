$kind: http-request
url: "{{base_url}}/auth"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: "{\r

    \    \"username\": \"{{username}}\",\r

    \    \"password\": \"{{password}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Login returns 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const body = pm.response.json();\r

      \r

      pm.test(\"Token is a string\", function () {\r

      \    pm.expect(body.token).to.be.a(\"string\");\r

      });\r

      \r

      pm.environment.set(\"token\", body.token);"
    language: text/javascript
settings:
  disabledSystemHeaders: []
order: 2000
